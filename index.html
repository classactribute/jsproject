<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
        <title>Document</title>
    </head>
    <body onload="startTime()">
        <div id="form" class="container border border-primary d-flex-row justify-content-center">
            <h2>Login</h2>
            <label for="email">Email Address</label><br>
            <input type="text" name="email" id="email"><br>
            <label for="password">Password</label><br>
            <input type="password" name="password" id="password"><br><br>
            <button id="btn" onclick="login()">Login</button>
            <div id="emailError" class="container"></div>
            <ul id="weather1"></ul>
            <ul id="weather2"></ul>
            <ul id="weather3"></ul>
            <ul id="weather4"></ul>
            <ul id="weather5"></ul>
            <p>Today's message: <span id="message">"in init"</span></p>
            <p>Today's date: <span id="date"></span></p>
            <div id="dateDisplay"></div>
            <p>Time now: <span id="time"></span></p>
        </div>
        <script src="jquery.min.js"></script>
        <script src="login.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
      </body>
</html>
